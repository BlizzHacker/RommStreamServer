# Appended to RetroArch's own config for every streamed session
# (runner_retroarch.start_retroarch --appendconfig).
#
# Input is bound explicitly rather than left to autodetection: this box has no
# autoconfig profiles installed at all, so a virtual pad would be enumerated and
# then left unmapped. Every index below follows from how vpad.py declares the
# device, and udev enumerates by ascending evdev code:
#
#   axes    ABS_X=0  ABS_Y=1  ABS_Z=2  ABS_RX=3  ABS_RY=4  ABS_RZ=5
#   buttons SOUTH=0 EAST=1 NORTH=2 WEST=3 TL=4 TR=5 SELECT=6 START=7
#           MODE=8 THUMBL=9 THUMBR=10
#
# Change vpad.py's capability list and these indices shift.

# linuxraw, not udev: the udev driver enumerates through libudev, and with no
# udevd running in this container that returns nothing at all — RetroArch started
# happily and never opened the pad. linuxraw reads /dev/input/js* directly.
input_joypad_driver = "linuxraw"
input_max_users = "1"
# Autodetection would overwrite these binds with a profile that does not exist.
input_autodetect_enable = "false"
input_menu_toggle_gamepad_combo = "0"

# Face buttons. RetroPad's B/A are bottom/right, which is Xbox A/B — not a typo.
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_y_btn = "3"
input_player1_x_btn = "2"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_select_btn = "6"
input_player1_start_btn = "7"
input_player1_l3_btn = "9"
input_player1_r3_btn = "10"

# D-pad arrives as hat 0.
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"

# Triggers are absolute axes on this layout, not buttons.
input_player1_l2_axis = "+2"
input_player1_r2_axis = "+5"

# The reason this file exists: analog sticks. Anything with a 3D camera —
# GameCube, Wii, N64, Dreamcast — is close to unplayable without them, and key
# injection cannot express an axis.
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+3"
input_player1_r_x_minus_axis = "-3"
input_player1_r_y_plus_axis = "+4"
input_player1_r_y_minus_axis = "-4"

# Keep the keyboard live as well: it is the fallback when no pad could be
# created, and xdotool drives it.
input_driver = "x"

# Verbose so a session log can confirm the pad was found; the runner keeps one
# log per display.
log_verbosity = "true"
